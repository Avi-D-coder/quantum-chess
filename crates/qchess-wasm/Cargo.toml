[package]
name = "qchess-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Quantum chess engine, game room and computer opponent for the browser (WebAssembly)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"
qchess = { path = "../qchess" }
qchess-play = { path = "../qchess-play", features = ["json", "serde"] }
serde_json = "1"
