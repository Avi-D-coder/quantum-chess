[package]
name = "qchess-play"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-independent game-server logic for quantum chess"
publish = false

[dependencies]
qchess = { path = "../qchess" }
glicko2 = { path = "../glicko2" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# The protocol JSON of docs/PROTOCOL.md.
json = ["dep:serde_json"]
# Serialize/Deserialize for the lobby types (for hosts that persist them).
serde = ["dep:serde", "glicko2/serde"]
