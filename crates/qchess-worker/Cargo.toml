[package]
name = "qchess-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Quantum chess multiplayer server as a Cloudflare Worker with Durable Objects"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
qchess = { path = "../qchess" }
qchess-play = { path = "../qchess-play", features = ["json", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
